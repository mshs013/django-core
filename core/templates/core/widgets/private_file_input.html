{% if widget.is_initial %}{% if widget.preview_url %}<a href="{{ widget.preview_url }}" target="_blank" rel="noopener"><img src="{{ widget.preview_url }}" alt="" class="core-file-preview"></a>{% endif %}<div class="small text-secondary mb-1">{{ widget.initial_text }}: <span class="text-body">{{ widget.file_name }}</span>{% if not widget.required %}
  <label class="form-check form-check-inline ms-2 mb-0"><input type="checkbox" class="form-check-input" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}><span class="form-check-label">{{ widget.clear_checkbox_label }}</span></label>{% endif %}</div>
{% endif %}<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
