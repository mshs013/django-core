<form method="post" action="{{ action }}" hx-post="{{ action }}" hx-target="#core-modal-content" hx-swap="innerHTML">{% csrf_token %}
  <div class="modal-header"><h5 class="modal-title">Delete menu item?</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><p class="mb-0"><strong>{{ obj.title }}</strong><br>This removes the item{% if children %} <strong>and its {{ children }} sub-item{{ children|pluralize }}</strong>{% endif %} from the menu. It cannot be undone.</p></div>
  <div class="modal-footer"><button type="button" class="btn me-auto" data-bs-dismiss="modal">Cancel</button><button class="btn btn-danger" type="submit">Delete</button></div>
</form>
