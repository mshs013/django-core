{% load core_tags %}{% if pager_mode == "post" %}<a class="page-link" href="#" hx-post="{{ pager_url }}" hx-target="{{ pager_target }}" hx-include="{{ pager_include }}" hx-vals='{"action": "preview", "page": "{{ p }}"}'{% if label %} aria-label="{{ label }}"{% endif %}>{{ text }}</a>{% elif pager_mode == "get" %}<a class="page-link" href="#" hx-get="{{ pager_url }}?page={{ p }}" hx-target="{{ pager_target }}" hx-include="{{ pager_include }}" hx-push-url="false"{% if label %} aria-label="{{ label }}"{% endif %}>{{ text }}</a>{% else %}<a class="page-link" href="?{% qs_with page=p %}"{% if label %} aria-label="{{ label }}"{% endif %}{% if p == page.number %} aria-current="page"{% endif %}>{{ text }}</a>{% endif %}
