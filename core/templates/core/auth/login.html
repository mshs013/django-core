{% extends "core/auth/_shell.html" %}
{% block body %}
<h2 class="h2 text-center mb-4">Sign in</h2>
{% if timeout %}<div class="alert alert-warning">You were signed out after a period of inactivity.</div>{% endif %}
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post" autocomplete="on">{% csrf_token %}
  <input type="hidden" name="next" value="{{ request.GET.next }}">
  <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" value="{{ email }}" class="form-control" autocomplete="username" required autofocus></div>
  <div class="mb-3"><label class="form-label">Password <span class="form-label-description"><a href="{% url 'core:password_reset' %}">Forgot?</a></span></label>
    <input type="password" name="password" class="form-control" autocomplete="current-password" required></div>
  <button class="btn btn-primary w-100">Sign in</button>
</form>{% endblock %}
