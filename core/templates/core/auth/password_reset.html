{% extends "core/auth/_shell.html" %}
{% block body %}
<h2 class="h2 text-center mb-4">Reset password</h2>
{% if form.errors %}<div class="alert alert-danger">{{ form.errors }}</div>{% endif %}
<form method="post">{% csrf_token %}
  {% for field in form %}{% include "core/_field.html" %}{% endfor %}
  <button class="btn btn-primary w-100">Submit</button></form>{% endblock %}
